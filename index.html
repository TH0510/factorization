<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5をつくろう！</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
        text-align: center;
        background-color: #f0f8ff;
        color: #333;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
        min-height: 100vh;
    }
    h1 {
        color: #ff8c00;
        font-size: 32px;
        margin: 8px 0 20px;
    }
    .layout {
        display: grid;
        grid-template-columns: 216px minmax(0, 680px) 176px;
        justify-content: center;
        align-items: start;
        gap: 16px;
        max-width: 1120px;
        margin: 0 auto;
    }
    .game-area {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 28px 24px 32px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        position: relative;
        min-width: 0;
        overflow: visible;
    }
    .message {
        font-size: 24px;
        font-weight: bold;
        color: #555;
        margin-bottom: 12px;
        min-height: 64px;
    }
    .frame-spin {
        width: fit-content;
        margin: 36px auto 24px;
        transform-origin: 50% 50%;
        will-change: transform;
        z-index: 2;
    }
    .frame-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        width: fit-content;
        margin: 0;
        position: relative;
        z-index: 1;
        min-height: 80px;
        transition: min-height 0.2s, margin 0.2s;
    }
    .frame-row {
        display: flex;
        justify-content: flex-start;
        gap: 10px;
    }
    .box {
        width: 80px;
        height: 80px;
        border: 4px solid #4caf50;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #e8f5e9;
        transition: background-color 0.2s, transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }
    .box.empty-hint {
        background-color: #fff8e1;
        border-color: #ffb300;
    }
    .box.shake,
    .equation.shake {
        animation: shake 0.45s ease-in-out;
    }
    .ball {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
    }
    .ball.landed {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .ball.flying,
    .num-chip,
    .fruit-chip {
        position: fixed;
        margin: 0;
        z-index: 1000;
        pointer-events: none;
        will-change: transform;
    }
    .num-chip {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-color: #448aff;
        color: #fff;
        font-size: 32px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 12px rgba(68, 138, 255, 0.35);
    }
    .num-chip.red-chip {
        background-color: #ff5252;
        box-shadow: 0 6px 12px rgba(255, 82, 82, 0.35);
    }
    .red { background-color: #ff5252; }
    .blue { background-color: #448aff; }

    .game-area.no-grid .box {
        border-color: transparent;
        background-color: transparent;
    }
    .game-area.no-grid .box.empty-hint {
        background-color: transparent;
    }
    .game-area.no-balls .ball:not(.flying) {
        visibility: hidden;
    }
    .game-area.no-balls .box:has(.red) {
        background-color: #ffcdd2;
        border-color: #e57373;
    }
    .game-area.no-balls .box:has(.blue) {
        background-color: #bbdefb;
        border-color: #64b5f6;
    }
    .game-area.no-grid.no-balls .box:has(.red),
    .game-area.no-grid.no-balls .box:has(.blue) {
        background-color: transparent;
        border-color: transparent;
        box-shadow: none;
    }
    .game-area.no-grid.no-balls .frame-spin {
        margin: 0;
    }
    .game-area.no-grid.no-balls .frame-container {
        min-height: 0;
        height: 0;
        margin: 0;
        overflow: hidden;
        visibility: hidden;
    }
    .game-area.no-grid.no-balls .equation {
        font-size: 64px;
        min-height: 90px;
        margin: 36px 0 20px;
    }

    @keyframes pop {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px) rotate(-2deg); }
        40% { transform: translateX(8px) rotate(2deg); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
    }
    @keyframes tree-bloom {
        0%, 100% { transform: scale(1); }
        40% { transform: scale(1.08); }
        70% { transform: scale(0.96); }
    }
    @keyframes sparkle {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.35); }
    }
    @keyframes grass-grow {
        0% { transform: translateX(-50%) scaleY(0); }
        70% { transform: translateX(-50%) scaleY(1.15); }
        100% { transform: translateX(-50%) scaleY(1); }
    }
    @keyframes bloom-pop {
        0% { transform: translateX(-50%) scale(0); }
        80% { transform: translateX(-50%) scale(1.25); }
        100% { transform: translateX(-50%) scale(1); }
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0.55; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes star-pop {
        0% { transform: scale(0); }
        80% { transform: scale(1.5); }
        100% { transform: scale(1); }
    }

    .equation {
        font-size: 42px;
        font-weight: bold;
        color: #ff4081;
        margin: 12px 0 8px;
        min-height: 56px;
        letter-spacing: 4px;
        transition: font-size 0.2s, margin 0.2s;
    }
    .eq-red { color: #ff5252; }
    .eq-blue { color: #448aff; }
    .eq-blank {
        color: #90a4ae;
        display: inline-block;
        min-width: 0.9em;
    }

    .choices {
        margin-top: 8px;
    }
    .choices-label {
        font-size: 22px;
        font-weight: bold;
        color: #1565c0;
        margin-bottom: 14px;
    }
    .choice-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        max-width: 430px;
        margin: 0 auto;
    }
    .choice-btn {
        width: 72px;
        height: 72px;
        border: none;
        border-radius: 50%;
        color: white;
        font-size: 32px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0,0,0,0.18);
        transition: transform 0.15s, filter 0.15s;
    }
    .choice-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        filter: brightness(1.08);
    }
    .choice-btn:active:not(:disabled) {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }
    .choice-btn:disabled {
        cursor: default;
        opacity: 0.55;
    }
    .choice-btn[data-count="1"], .tgt-btn[data-n="1"] { background-color: #42a5f5; }
    .choice-btn[data-count="2"], .tgt-btn[data-n="2"] { background-color: #66bb6a; }
    .choice-btn[data-count="3"], .tgt-btn[data-n="3"] { background-color: #ffa726; }
    .choice-btn[data-count="4"], .tgt-btn[data-n="4"] { background-color: #ab47bc; }
    .choice-btn[data-count="5"], .tgt-btn[data-n="5"] { background-color: #ef5350; }
    .choice-btn[data-count="6"], .tgt-btn[data-n="6"] { background-color: #26c6da; }
    .choice-btn[data-count="7"], .tgt-btn[data-n="7"] { background-color: #8d6e63; }
    .choice-btn[data-count="8"], .tgt-btn[data-n="8"] { background-color: #ec407a; }
    .choice-btn[data-count="9"], .tgt-btn[data-n="9"] { background-color: #7e57c2; }
    .choice-btn[data-count="10"], .tgt-btn[data-n="10"] { background-color: #5c6bc0; }

    .next-btn {
        background-color: #ff9800;
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 24px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        transition: all 0.2s;
        margin-top: 8px;
    }
    .next-btn:hover {
        background-color: #f57c00;
        transform: translateY(-2px);
    }
    .next-btn:active {
        transform: translateY(2px);
        box-shadow: none;
    }
    .hidden {
        display: none !important;
    }

    .grove {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 16px 12px 18px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        text-align: center;
    }
    .grove-title {
        font-size: 15px;
        font-weight: bold;
        color: #546e7a;
        margin: 0 0 10px;
        letter-spacing: 0.04em;
    }
    .harvest-meter {
        font-size: 16px;
        font-weight: bold;
        color: #37474f;
        margin-bottom: 6px;
        white-space: nowrap;
    }
    .harvest-meter strong {
        color: #e53935;
        font-size: 22px;
    }
    .harvest-meter.done strong {
        color: #43a047;
    }
    .sky {
        position: relative;
        height: 228px;
        border-radius: 16px;
        background: linear-gradient(#e3f2fd 0%, #fff8e1 78%, #c8e6c9 78%, #a5d6a7 100%);
        overflow: hidden;
        margin-bottom: 12px;
        transition: background 0.6s ease;
    }
    .sky.starry {
        background: linear-gradient(#90caf9 0%, #e3f2fd 42%, #fff8e1 78%, #c8e6c9 78%, #a5d6a7 100%);
    }
    .sky.starry-deep {
        background: linear-gradient(#1a237e 0%, #5c6bc0 48%, #ffe0b2 78%, #c8e6c9 78%, #a5d6a7 100%);
    }
    .star-field {
        position: absolute;
        inset: 0 0 24% 0;
        z-index: 1;
        pointer-events: none;
    }
    .sky-star {
        position: absolute;
        width: 7px;
        height: 7px;
        background: #fffde7;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        filter: drop-shadow(0 0 3px #fff59d);
        animation: twinkle 1.6s ease-in-out infinite;
    }
    .sky-star.just-grew {
        animation: star-pop 0.45s ease, twinkle 1.6s ease-in-out 0.45s infinite;
    }
    .sky.bloom .canopy {
        animation: tree-bloom 0.7s ease;
    }
    .tree {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
    }
    .canopy {
        position: relative;
        width: 148px;
        height: 122px;
        background: radial-gradient(circle at 40% 40%, #66bb6a, #2e7d32 58%, #1b5e20);
        border-radius: 50% 50% 46% 46%;
        box-shadow: inset -10px -12px 0 rgba(0,0,0,0.08);
        z-index: 2;
        transform-origin: 50% 100%;
    }
    .trunk {
        width: 20px;
        height: 48px;
        margin-top: -8px;
        background: linear-gradient(90deg, #8d6e63, #6d4c41);
        border-radius: 4px;
        z-index: 1;
    }
    .meadow {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 26%;
        z-index: 4;
        pointer-events: none;
    }
    .grass {
        position: absolute;
        bottom: 6px;
        width: 12px;
        transform: translateX(-50%);
        transform-origin: 50% 100%;
    }
    .grass.just-grew {
        animation: grass-grow 0.5s ease;
    }
    .grass-blade {
        width: 8px;
        height: 100%;
        margin: 0 auto;
        background: linear-gradient(#9ccc65, #558b2f);
        border-radius: 80% 20% 50% 50%;
        box-shadow: 3px 2px 0 -1px #7cb342;
    }
    .bloom {
        position: absolute;
        top: -7px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: 0;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #ff80ab;
        box-shadow:
            0 -5px 0 #f48fb1,
            5px 0 0 #f06292,
            0 5px 0 #ec407a,
            -5px 0 0 #f48fb1;
    }
    .bloom.hue-1 {
        background: #fff59d;
        box-shadow:
            0 -5px 0 #ffe082,
            5px 0 0 #ffd54f,
            0 5px 0 #ffca28,
            -5px 0 0 #ffe082;
    }
    .bloom.hue-2 {
        background: #ce93d8;
        box-shadow:
            0 -5px 0 #e1bee7,
            5px 0 0 #ba68c8,
            0 5px 0 #ab47bc,
            -5px 0 0 #e1bee7;
    }
    .bloom.just-grew {
        animation: bloom-pop 0.45s ease;
    }
    .tree-apple {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ff8a80, #e53935 58%, #b71c1c);
        box-shadow: inset -2px -2px 0 rgba(0,0,0,0.12);
        z-index: 4;
    }
    .tree-apple.golden {
        background: radial-gradient(circle at 30% 30%, #fff59d, #ffd54f 45%, #ff8f00);
        box-shadow: 0 0 8px rgba(255, 213, 79, 0.9);
        animation: sparkle 1.2s ease-in-out infinite;
    }
    .fruit-chip {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ff8a80, #e53935 58%, #b71c1c);
        box-shadow: 0 4px 10px rgba(229, 57, 53, 0.35);
    }
    .fruit-chip.golden {
        background: radial-gradient(circle at 30% 30%, #fff59d, #ffd54f 45%, #ff8f00);
        box-shadow: 0 0 12px rgba(255, 213, 79, 0.9);
    }
    .streak-caption {
        font-size: 14px;
        font-weight: bold;
        color: #546e7a;
        margin: 0;
    }
    .streak-caption strong {
        color: #1565c0;
        font-size: 18px;
    }

    .controls {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 18px 14px 20px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        text-align: left;
    }
    .controls-title {
        font-size: 15px;
        font-weight: bold;
        color: #546e7a;
        margin: 0 0 14px;
        text-align: center;
        letter-spacing: 0.04em;
    }
    .ctrl-group {
        margin-bottom: 18px;
    }
    .ctrl-group:last-child {
        margin-bottom: 0;
    }
    .ctrl-label {
        font-size: 18px;
        font-weight: bold;
        color: #37474f;
        margin-bottom: 8px;
        text-align: center;
    }
    .ctrl-btns {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .ctrl-btn {
        border: 2px solid #b0bec5;
        background: #eceff1;
        color: #455a64;
        border-radius: 12px;
        padding: 10px 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
        line-height: 1.25;
    }
    .ctrl-btn.active {
        background: #1565c0;
        border-color: #1565c0;
        color: #fff;
    }
    .ctrl-btn:hover:not(.active):not(:disabled) {
        background: #cfd8dc;
    }
    .ctrl-btn:disabled {
        opacity: 0.45;
        cursor: default;
    }
    .tgt-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }
    .tgt-btn {
        border: 2px solid transparent;
        color: #fff;
        border-radius: 10px;
        padding: 8px 0;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
        opacity: 0.55;
    }
    .tgt-btn.active {
        opacity: 1;
        box-shadow: 0 0 0 2px #1565c0, 0 0 0 4px #fff;
        transform: scale(1.06);
    }
    .tgt-btn:hover:not(.active) {
        opacity: 0.85;
    }

    @media (max-width: 1000px) {
        .layout {
            grid-template-columns: minmax(0, 680px) 176px;
        }
        .grove {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 216px 1fr;
            align-items: center;
            gap: 12px 16px;
        }
        .grove-title { grid-column: 1 / -1; margin-bottom: 0; }
        .sky { margin-bottom: 0; }
    }
    @media (max-width: 760px) {
        .layout {
            grid-template-columns: 1fr;
        }
        .grove {
            grid-column: auto;
            display: block;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
        }
        .controls-title {
            grid-column: 1 / -1;
            margin-bottom: 4px;
        }
        .ctrl-group {
            margin-bottom: 0;
        }
        .tgt-group, .drill-group {
            grid-column: 1 / -1;
        }
    }
</style>
</head>
<body>

    <h1 id="game-title">🍎 5 を つくろう！ 🍏</h1>

    <div class="layout">
        <aside class="grove" aria-label="きょうのしゅうかく">
            <p class="grove-title">ぼくのき</p>
            <div class="sky" id="tree-sky">
                <div class="star-field" id="star-field"></div>
                <div class="tree">
                    <div class="canopy" id="canopy"></div>
                    <div class="trunk"></div>
                </div>
                <div class="meadow" id="meadow"></div>
            </div>
            <div class="harvest-meter" id="harvest-meter">きょうのりんご <strong>0</strong> / 30</div>
            <p class="streak-caption" id="streak-caption">れんぞく <strong>0</strong> 日</p>
        </aside>

        <div class="game-area" id="game-area">
            <div id="message" class="message">あかだま が あるよ。<br>あおだま は いくつ いるかな？</div>

            <div class="frame-spin" id="frame-spin">
                <div class="frame-container" id="frames"></div>
            </div>

            <div id="equation" class="equation"></div>

            <div id="choices" class="choices">
                <div class="choices-label" id="choices-label">あおだま は いくつ？</div>
                <div class="choice-row" id="choice-row"></div>
            </div>

            <button id="next-btn" class="next-btn hidden">つぎのもんだい！</button>
        </div>

        <aside class="controls" aria-label="表示のきりかえ">
            <p class="controls-title">ステップアップ</p>
            <div class="ctrl-group tgt-group">
                <div class="ctrl-label">合計</div>
                <div class="tgt-grid" id="target-grid"></div>
            </div>
            <div class="ctrl-group drill-group">
                <div class="ctrl-btns">
                    <button type="button" class="ctrl-btn" id="drill1-btn">10特訓その1</button>
                    <button type="button" class="ctrl-btn" id="drill2-btn">10特訓その2</button>
                    <button type="button" class="ctrl-btn" id="drill3-btn">10特訓その3</button>
                </div>
            </div>
            <div class="ctrl-group">
                <div class="ctrl-label">格子</div>
                <div class="ctrl-btns">
                    <button type="button" class="ctrl-btn active" data-setting="grid" data-value="on">あり</button>
                    <button type="button" class="ctrl-btn" data-setting="grid" data-value="off">なし</button>
                </div>
            </div>
            <div class="ctrl-group">
                <div class="ctrl-label">球</div>
                <div class="ctrl-btns">
                    <button type="button" class="ctrl-btn active" data-setting="balls" data-value="on">あり</button>
                    <button type="button" class="ctrl-btn" data-setting="balls" data-value="off">なし</button>
                </div>
            </div>
        </aside>
    </div>

<script>
    const HARVEST_GOAL = 30;
    const GRASS_MAX = 10;

    const GOLDEN_EVERY = 10;

        { x: 12, y: 22 }, { x: 40, y: 22 }, { x: 58, y: 20 }, { x: 76, y: 24 }, { x: 92, y: 40 },
        { x: 22, y: 30 }, { x: 48, y: 62 }, { x: 64, y: 70 }, { x: 30, y: 72 }, { x: 82, y: 68 },
        { x: 6, y: 38 }, { x: 38, y: 40 }, { x: 56, y: 74 }, { x: 70, y: 8 }, { x: 90, y: 22 }

    const GRASS_SPOTS = [
        { x: 7, h: 18 }, { x: 17, h: 24 }, { x: 27, h: 16 }, { x: 37, h: 21 },
        { x: 63, h: 19 }, { x: 73, h: 23 }, { x: 83, h: 15 }, { x: 92, h: 20 },
        { x: 12, h: 14 }, { x: 78, h: 17 }
    ];
    const STAR_SPOTS = [
        { x: 8, y: 10 }, { x: 22, y: 6 }, { x: 36, y: 14 }, { x: 52, y: 5 }, { x: 68, y: 12 }, { x: 84, y: 8 },
        { x: 12, y: 28 }, { x: 28, y: 22 }, { x: 44, y: 30 }, { x: 60, y: 18 }, { x: 76, y: 26 }, { x: 90, y: 20 },
        { x: 6, y: 44 }, { x: 20, y: 38 }, { x: 34, y: 46 }, { x: 50, y: 36 }, { x: 66, y: 42 }, { x: 82, y: 34 },
        { x: 16, y: 16 }, { x: 40, y: 8 }, { x: 58, y: 24 }, { x: 72, y: 6 }, { x: 88, y: 40 }, { x: 30, y: 34 }
    ];

    const gameArea = document.getElementById('game-area');
    const framesContainer = document.getElementById('frames');
    const frameSpin = document.getElementById('frame-spin');
    const messageEl = document.getElementById('message');
    const equationEl = document.getElementById('equation');
    const nextBtn = document.getElementById('next-btn');
    const choicesEl = document.getElementById('choices');
    const choicesLabel = document.getElementById('choices-label');
    const choiceRow = document.getElementById('choice-row');

    const gameTitle = document.getElementById('game-title');
    const targetGrid = document.getElementById('target-grid');
    const drill1Btn = document.getElementById('drill1-btn');
    const drill2Btn = document.getElementById('drill2-btn');
    const drill3Btn = document.getElementById('drill3-btn');
    const treeSky = document.getElementById('tree-sky');
    const canopy = document.getElementById('canopy');
    const meadow = document.getElementById('meadow');
    const starField = document.getElementById('star-field');
    const harvestMeter = document.getElementById('harvest-meter');
    const streakCaption = document.getElementById('streak-caption');

    let target = 5;
    let redCount = 0;
    let busy = false;
    let solved = false;
    let showGrid = true;
    let showBalls = true;
    let boxesInOrder = [];
    let remainingQueue = [];
    let resumeCurrent = false;
    let apples = [];
    let solves = 0;
    let harvestDone = false;
    let streak = 0;
    let lastHarvestDate = '';
    let mode = 'normal';
    let drillPhase = 'ask-blue';
    let flipReady = false;

    function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function dateKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function shiftDateKey(days) {
        const date = new Date();
        date.setDate(date.getDate() + days);
        return dateKey(date);
    }

    function shuffle(list) {
        const arr = list.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildFairQueue(opts, length, avoidStart = 0) {
        if (!opts.length) return Array(length).fill(1);

        const counts = {};
        opts.forEach((n) => { counts[n] = 0; });
        const base = Math.floor(length / opts.length);
        let extra = length % opts.length;
        shuffle(opts).forEach((n) => {
            counts[n] = base + (extra > 0 ? 1 : 0);
            if (extra > 0) extra -= 1;
        });

        const result = [];
        let last = avoidStart;
        for (let i = 0; i < length; i++) {
            const remaining = opts.filter((n) => counts[n] > 0);
            let candidates = remaining.filter((n) => n !== last);
            if (!candidates.length) candidates = remaining;
            const maxLeft = Math.max(...candidates.map((n) => counts[n]));
            candidates = candidates.filter((n) => counts[n] === maxLeft);
            const pick = candidates[Math.floor(Math.random() * candidates.length)];
            result.push(pick);
            counts[pick] -= 1;
            last = pick;
        }
        return result;
    }

    function loadState() {
        let saved = null;
        try {
            saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        } catch (err) {
            saved = null;
        }
        const today = dateKey();
        const yesterday = shiftDateKey(-1);

        streak = Number(saved && saved.streak) || 0;
        lastHarvestDate = (saved && saved.lastHarvestDate) || '';
        if (saved && Number(saved.target) >= 2 && Number(saved.target) <= 10) {
            target = Number(saved.target);
        }

        if (lastHarvestDate !== today && lastHarvestDate !== yesterday) {
            streak = 0;
        }

        if (saved && saved.playDate === today) {
            apples = Array.isArray(saved.apples) ? saved.apples.slice(0, HARVEST_GOAL) : [];
            solves = Math.max(Number(saved.solves) || apples.length, apples.length);
            harvestDone = solves >= HARVEST_GOAL;
            if (Number(saved.currentRed) >= 1 && Number(saved.currentRed) < target) {
                redCount = Number(saved.currentRed);
                remainingQueue = Array.isArray(saved.remainingQueue) ? saved.remainingQueue : [];
                resumeCurrent = true;
            }
        } else {
            apples = [];
            solves = 0;
            harvestDone = false;
            remainingQueue = [];
            resumeCurrent = false;
        }
    }

    function saveState() {
        const payload = {
            playDate: dateKey(),
            target,
            currentRed: redCount,
            remainingQueue,
            apples,
            solves,
            harvestDone,
            streak,
            lastHarvestDate
        };
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
            /* ignore quota / private mode */
        }
    }

    function grassCount() {
        return Math.min(GRASS_MAX, Math.max(0, solves - HARVEST_GOAL));
    }

    function flowerCount() {
        return Math.min(FLOWER_MAX, Math.max(0, solves - HARVEST_GOAL - GRASS_MAX));
    }

    function starCount() {
        return Math.min(STAR_MAX, Math.max(0, solves - HARVEST_GOAL - GRASS_MAX - FLOWER_MAX));
    }

    function renderTree() {
        canopy.querySelectorAll('.tree-apple').forEach((el) => el.remove());
        apples.slice(0, HARVEST_GOAL).forEach((apple, i) => {
            const spot = APPLE_SPOTS[i];
            const el = document.createElement('div');
            el.className = 'tree-apple' + (apple.golden ? ' golden' : '');
            el.style.left = `${spot.x}%`;
            el.style.top = `${spot.y}%`;
            canopy.appendChild(el);
        });
    }

    function renderMeadow() {
        meadow.innerHTML = '';
        const grasses = grassCount();
        const flowers = flowerCount();
        for (let i = 0; i < grasses; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'grass';
            wrap.style.left = `${GRASS_SPOTS[i].x}%`;
            wrap.style.height = `${GRASS_SPOTS[i].h}px`;
            const blade = document.createElement('div');
            blade.className = 'grass-blade';
            wrap.appendChild(blade);
            if (i < flowers) {
                const bloom = document.createElement('div');
                bloom.className = `bloom hue-${i % 3}`;
                wrap.appendChild(bloom);
            }
            meadow.appendChild(wrap);
        }
    }

    function renderStars() {
        starField.innerHTML = '';
        const n = starCount();
        treeSky.classList.toggle('starry', n > 0 && n < 8);
        treeSky.classList.toggle('starry-deep', n >= 8);
        for (let i = 0; i < n; i++) {
            const star = document.createElement('div');
            star.className = 'sky-star';
            star.style.left = `${STAR_SPOTS[i].x}%`;
            star.style.top = `${STAR_SPOTS[i].y}%`;
            star.style.animationDelay = `${(i % 7) * 0.18}s`;
            starField.appendChild(star);
        }
    }

    function popLast(selector) {
        const els = treeSky.querySelectorAll(selector);
        const last = els[els.length - 1];
        if (!last) return;
        last.classList.remove('just-grew');
        void last.offsetWidth;
        last.classList.add('just-grew');
    }

    function renderHarvestMeter() {
        harvestMeter.classList.toggle('done', harvestDone);
        if (solves <= HARVEST_GOAL) {
            harvestMeter.innerHTML = `きょうのりんご <strong>${Math.min(apples.length, HARVEST_GOAL)}</strong> / ${HARVEST_GOAL}`;
        } else if (solves <= HARVEST_GOAL + GRASS_MAX) {
            harvestMeter.innerHTML = `きょうのくさ <strong>${grassCount()}</strong> / ${GRASS_MAX}`;
        } else if (solves <= HARVEST_GOAL + GRASS_MAX + FLOWER_MAX) {
            harvestMeter.innerHTML = `きょうのはな <strong>${flowerCount()}</strong> / ${FLOWER_MAX}`;
        } else {
            harvestMeter.innerHTML = `きょうのほし <strong>${starCount()}</strong>`;
        }
        streakCaption.innerHTML = `れんぞく <strong>${streak}</strong> 日`;
    }

    function refreshOrchard(grew) {
        renderTree();
        renderMeadow();
        renderStars();
        renderHarvestMeter();
        if (grew === 'grass') popLast('.grass');
        if (grew === 'flower') popLast('.bloom');
        if (grew === 'star') popLast('.sky-star');
    }

    function nextAppleSlot() {
        let index = apples.length;
        if (index >= HARVEST_GOAL) {
            const plain = apples.findIndex((apple) => !apple.golden);
            index = plain >= 0 ? plain : HARVEST_GOAL - 1;
        }
        let slot = canopy.querySelectorAll('.tree-apple')[index];
        if (!slot) {
            const spot = APPLE_SPOTS[index] || APPLE_SPOTS[0];
            slot = document.createElement('div');
            slot.className = 'tree-apple';
            slot.style.left = `${spot.x}%`;
            slot.style.top = `${spot.y}%`;
            slot.style.visibility = 'hidden';
            canopy.appendChild(slot);
        }
        return slot;
    }

    function emptyBoxes() {
        return boxesInOrder.filter((box) => !box.querySelector('.ball'));
    }

    function fillColor() {
        return drillPhase === 'ask-red' ? 'red' : 'blue';
    }

    function knownCount() {
        return drillPhase === 'ask-red' ? target - redCount : redCount;
    }

    function neededCount() {
        return target - knownCount();
    }

    function clearFillBalls() {
        const color = fillColor();
        framesContainer.querySelectorAll(`.ball.${color}`).forEach((ball) => ball.remove());
        framesContainer.querySelectorAll('.box').forEach((box) => {
            box.classList.remove('empty-hint', 'shake');
        });
    }

    function setChoicesEnabled(enabled) {
        choiceRow.querySelectorAll('.choice-btn').forEach((btn) => {
            btn.disabled = !enabled;
        });
    }

    function placeFillBalls(count, colorClass) {
        emptyBoxes().slice(0, count).forEach((box) => {
            const landed = document.createElement('div');
            landed.className = `ball ${colorClass} landed`;
            box.appendChild(landed);
        });
    }

    function updateChoicesLabel() {
        if (!showBalls) {
            choicesLabel.textContent = 'いくつ たす？';
            return;
        }
        choicesLabel.textContent = drillPhase === 'ask-red'
            ? 'あかだま は いくつ？'
            : 'あおだま は いくつ？';
    }

    function applyDisplayMode() {
        if (!showBalls) showGrid = false;
        gameArea.classList.toggle('no-grid', !showGrid);
        gameArea.classList.toggle('no-balls', !showBalls);
        updateChoicesLabel();
        refreshEquation();
        document.querySelectorAll('.ctrl-btn[data-setting]').forEach((btn) => {
            const on = btn.dataset.setting === 'grid' ? showGrid : showBalls;
            btn.classList.toggle('active', (btn.dataset.value === 'on') === on);
            if (btn.dataset.setting === 'grid') btn.disabled = !showBalls;
        });
        drill1Btn.classList.toggle('active', mode === 'drill1');
        drill2Btn.classList.toggle('active', mode === 'drill2');
        drill3Btn.classList.toggle('active', mode === 'drill3');
        document.querySelectorAll('.tgt-btn').forEach((btn) => {
            btn.classList.toggle('active', mode === 'normal' && Number(btn.dataset.n) === target);
        });
        gameTitle.textContent = `🍎 ${target} を つくろう！ 🍏`;
        document.title = `${target}をつくろう！`;
    }

    function refreshEquation(fillValue = null) {
        const known = knownCount();
        const knownClass = drillPhase === 'ask-red' ? 'eq-blue' : 'eq-red';
        const fillClass = drillPhase === 'ask-red' ? 'eq-red' : 'eq-blue';
        if (solved && fillValue === null) {
            equationEl.innerHTML =
                `<span class="${knownClass}">${known}</span> + <span class="${fillClass}">${neededCount()}</span> = ${target}`;
            return;
        }
        if (fillValue !== null) {
            equationEl.innerHTML =
                `<span class="${knownClass}">${known}</span> + <span class="${fillClass}">${fillValue}</span> = ${known + fillValue}`;
            return;
        }
        equationEl.innerHTML =
            `<span class="${knownClass}">${known}</span> + <span class="eq-blank">□</span> = ${target}`;
    }

    function buildChoiceButtons() {
        choiceRow.innerHTML = '';
        for (let n = 1; n <= target; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'choice-btn';
            btn.dataset.count = String(n);
            btn.textContent = String(n);
            btn.setAttribute('aria-label', `${n}`);
            btn.addEventListener('click', () => onChoose(n, btn));
            choiceRow.appendChild(btn);
        }
    }

    function buildTargetButtons() {
        targetGrid.innerHTML = '';
        for (let n = 2; n <= 10; n++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'tgt-btn';
            btn.dataset.n = String(n);
            btn.textContent = String(n);
            btn.addEventListener('click', () => {
                if (mode === 'normal' && target === n) return;
                mode = 'normal';
                target = n;
                remainingQueue = [];
                resumeCurrent = false;
                drillPhase = 'ask-blue';
                flipReady = false;
                buildChoiceButtons();
                initGame();
            });
            targetGrid.appendChild(btn);
        }
    }

    function startDrill(nextMode) {
        if (mode === nextMode && !solved && drillPhase === 'ask-blue') return;
        mode = nextMode;
        target = 10;
        remainingQueue = [];
        resumeCurrent = false;
        drillPhase = 'ask-blue';
        flipReady = false;
        buildChoiceButtons();
        initGame();
    }

    function promptMessage() {
        const known = knownCount();
        const askRed = drillPhase === 'ask-red';
        if (showBalls) {
            if (askRed) {
                return `あお が <strong>${known}</strong> こ あるよ。<br>あかだま は いくつ いるかな？`;
            }
            return `あか が <strong>${known}</strong> こ あるよ。<br>あお を いれて <strong>${target}</strong> に しよう！`;
        }
        return `<strong>${known}</strong> に いくつ たせば <strong>${target}</strong> になるかな？`;
    }

    function makeBox() {
        const box = document.createElement('div');
        box.className = 'box';
        return box;
    }

    function resetSpin() {
        frameSpin.getAnimations().forEach((anim) => anim.cancel());
        frameSpin.classList.remove('spinning');
        frameSpin.style.transform = '';
    }

    function buildFrames() {
        framesContainer.innerHTML = '';
        boxesInOrder = [];

        const bottomCount = Math.min(5, target);
        const topCount = Math.max(0, target - 5);
        const bottomRow = document.createElement('div');
        bottomRow.className = 'frame-row';
        const topRow = document.createElement('div');
        topRow.className = 'frame-row';

        for (let i = 0; i < bottomCount; i++) {
            const box = makeBox();
            bottomRow.appendChild(box);
            boxesInOrder.push(box);
        }
        for (let i = 0; i < topCount; i++) {
            const box = makeBox();
            topRow.appendChild(box);
            boxesInOrder.push(box);
        }

        if (topCount > 0) framesContainer.appendChild(topRow);
        framesContainer.appendChild(bottomRow);

        const filled = drillPhase === 'ask-red' ? target - redCount : redCount;
        const color = drillPhase === 'ask-red' ? 'blue' : 'red';
        boxesInOrder.forEach((box, i) => {
            if (i < filled) {
                const ball = document.createElement('div');
                ball.className = `ball ${color}`;
                box.appendChild(ball);
            }
        });
    }

    function drillRedOptions() {
        if (mode === 'drill1') return [5, 6, 7, 8, 9];
        if (mode === 'drill3') return [1, 2, 3, 4];
        if (mode === 'drill2') return [5, 6, 7, 8, 9];
        const opts = [];
        for (let n = 1; n < target; n++) opts.push(n);
        return opts;
    }

    function refillQueue() {
        const opts = drillRedOptions();
        const length = harvestDone
            ? HARVEST_GOAL
            : Math.max(HARVEST_GOAL - apples.length, opts.length);
        remainingQueue = buildFairQueue(opts, length, redCount);
    }

    function drawNextQuestion() {
        if (resumeCurrent && redCount >= 1 && redCount < target) {
            resumeCurrent = false;
            return;
        }
        resumeCurrent = false;
        if (!remainingQueue.length) refillQueue();
        redCount = remainingQueue.shift();
        saveState();
    }

    function initGame() {
        busy = false;
        solved = false;
        flipReady = false;
        drillPhase = 'ask-blue';
        resetSpin();
        drawNextQuestion();

        messageEl.innerHTML = promptMessage();
        nextBtn.classList.add('hidden');
        choicesEl.classList.remove('hidden');
        setChoicesEnabled(true);
        buildFrames();
        applyDisplayMode();
    }

    function spawnFlyingBall(fromEl, index, total, colorClass) {
        const rect = fromEl.getBoundingClientRect();
        const ball = document.createElement('div');
        ball.className = `ball ${colorClass} flying`;
        const offsetX = (index - (total - 1) / 2) * 14;
        ball.style.left = `${rect.left + (rect.width - 60) / 2 + offsetX}px`;
        ball.style.top = `${rect.top + (rect.height - 60) / 2}px`;
        document.body.appendChild(ball);
        return ball;
    }

    function spawnFlyingNumber(fromEl, value, askRed) {
        const rect = fromEl.getBoundingClientRect();
        const chip = document.createElement('div');
        chip.className = 'num-chip' + (askRed ? ' red-chip' : '');
        chip.textContent = String(value);
        chip.style.left = `${rect.left + (rect.width - 64) / 2}px`;
        chip.style.top = `${rect.top + (rect.height - 64) / 2}px`;
        document.body.appendChild(chip);
        return chip;
    }

    function flyFromTo(el, targetEl, extraY = -90) {
        const from = el.getBoundingClientRect();
        const to = targetEl.getBoundingClientRect();
        const dx = to.left + (to.width - from.width) / 2 - from.left;
        const dy = to.top + (to.height - from.height) / 2 - from.top;
        return el.animate([
            { transform: 'translate(0, 0) scale(1)' },
            { transform: `translate(${dx * 0.55}px, ${dy * 0.45 + extraY}px) scale(1.12)` },
            { transform: `translate(${dx}px, ${dy}px) scale(1)` }
        ], {
            duration: 520,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
        }).finished;
    }

    async function flyIntoBox(ball, box, colorClass) {
        await flyFromTo(ball, box);
        const landed = document.createElement('div');
        landed.className = `ball ${colorClass} landed`;
        box.appendChild(landed);
        ball.remove();
    }

    async function spillElement(el, lastBox, spillIndex) {
        const from = el.getBoundingClientRect();
        const target = lastBox.getBoundingClientRect();
        const towardX = target.right - from.left - from.width / 2 + 10 + spillIndex * 18;
        const towardY = target.top + 8 - from.top;
        const fallX = towardX + 40 + spillIndex * 36 + Math.random() * 24;
        const fallY = window.innerHeight - from.top + 40;

        await el.animate([
            { transform: 'translate(0, 0) rotate(0deg) scale(1)' },
            { transform: `translate(${towardX}px, ${towardY - 24}px) rotate(25deg) scale(1.05)` }
        ], {
            duration: 380,
            easing: 'ease-out',
            fill: 'forwards'
        }).finished;

        lastBox.classList.add('shake');

        await el.animate([
            { transform: `translate(${towardX}px, ${towardY - 24}px) rotate(25deg) scale(1.05)` },
            { transform: `translate(${fallX}px, ${fallY}px) rotate(420deg) scale(0.85)` }
        ], {
            duration: 780,
            easing: 'cubic-bezier(0.55, 0.09, 0.68, 0.2)',
            fill: 'forwards'
        }).finished;

        el.remove();
    }

    async function animateBalls(count, button, colorClass) {
        const empties = emptyBoxes();
        const flyingBalls = [];
        for (let i = 0; i < count; i++) {
            flyingBalls.push(spawnFlyingBall(button, i, count, colorClass));
        }
        await Promise.all(flyingBalls.map((ball, i) => wait(i * 150).then(() => {
            if (i < empties.length) {
                return flyIntoBox(ball, empties[i], colorClass);
            }
            const lastBox = boxesInOrder[boxesInOrder.length - 1];
            return spillElement(ball, lastBox, i - empties.length);
        })));
    }

    async function animateNumber(count, button, shouldSpill, colorClass) {
        refreshEquation();
        const chip = spawnFlyingNumber(button, count, drillPhase === 'ask-red');
        const blank = equationEl.querySelector('.eq-blank') || equationEl;
        if (shouldSpill) {
            await spillElement(chip, blank, 0);
            equationEl.classList.add('shake');
            wait(450).then(() => equationEl.classList.remove('shake'));
        } else {
            await flyFromTo(chip, blank, -60);
            chip.remove();
            refreshEquation(count);
        }
        placeFillBalls(Math.min(count, emptyBoxes().length), colorClass);
    }

    function fruitStartEl() {
        const color = drillPhase === 'ask-red' ? '.red' : '.blue';
        const balls = framesContainer.querySelectorAll(`.ball${color}`);
        if (showBalls && balls.length) return balls[balls.length - 1];
        return equationEl.querySelector(drillPhase === 'ask-red' ? '.eq-red' : '.eq-blue') || equationEl;
    }

    async function animateFruitToTree(golden) {
        const fromEl = fruitStartEl();
        const slot = nextAppleSlot();
        const rect = fromEl.getBoundingClientRect();
        const chip = document.createElement('div');
        chip.className = 'fruit-chip' + (golden ? ' golden' : '');
        chip.style.left = `${rect.left + (rect.width - 36) / 2}px`;
        chip.style.top = `${rect.top + (rect.height - 36) / 2}px`;
        document.body.appendChild(chip);
        await flyFromTo(chip, slot, -70);
        chip.remove();
        slot.remove();
    }

    function collectApple(golden) {
        if (apples.length < HARVEST_GOAL) {
            apples.push({ golden });
            return;
        }
        if (golden) {
            const plain = apples.findIndex((apple) => !apple.golden);
            if (plain >= 0) apples[plain].golden = true;
        }
    }

    function completeHarvest() {
        const today = dateKey();
        const yesterday = shiftDateKey(-1);
        harvestDone = true;
        if (lastHarvestDate !== today) {
            streak = lastHarvestDate === yesterday ? streak + 1 : 1;
            lastHarvestDate = today;
        }
        treeSky.classList.remove('bloom');
        void treeSky.offsetWidth;
        treeSky.classList.add('bloom');
        wait(800).then(() => treeSky.classList.remove('bloom'));
    }

    async function grantSolveReward() {
        const wasComplete = harvestDone;
        const prevSolves = solves;
        solves += 1;
        const golden = solves % GOLDEN_EVERY === 0;
        const canPlace = apples.length < HARVEST_GOAL;
        const canReplace = golden && apples.some((apple) => !apple.golden);
        if (canPlace || canReplace) {
            await animateFruitToTree(golden);
            collectApple(golden);
        }
        if (!wasComplete && solves >= HARVEST_GOAL) {
            completeHarvest();
        }
        let grew = '';
        if (prevSolves >= HARVEST_GOAL + GRASS_MAX + FLOWER_MAX && prevSolves < HARVEST_GOAL + GRASS_MAX + FLOWER_MAX + STAR_MAX) {
            grew = 'star';
        } else if (prevSolves >= HARVEST_GOAL + GRASS_MAX && prevSolves < HARVEST_GOAL + GRASS_MAX + FLOWER_MAX) {
            grew = 'flower';
        } else if (prevSolves >= HARVEST_GOAL && prevSolves < HARVEST_GOAL + GRASS_MAX) {
            grew = 'grass';
        }
        saveState();
        refreshOrchard(grew);
        return { wasComplete, golden, grew };
    }

    function rewardMessage(wasComplete, golden, grew) {
        if (!wasComplete && harvestDone) {
            return golden
                ? '<span style="color:#ff4081; font-size:32px;">🎉 しゅうかく かんせい！ 🎉</span><br>きんのりんご も なったよ！'
                : '<span style="color:#ff4081; font-size:32px;">🎉 きょうのしゅうかく かんせい！ 🎉</span>';
        }
        if (golden) return '<span style="color:#ff8f00; font-size:32px;">✨ きんのりんご！ ✨</span>';
        if (grew === 'grass') return '<span style="color:#43a047; font-size:32px;">🌱 くさが はえたよ！</span>';
        if (grew === 'flower') return '<span style="color:#ec407a; font-size:32px;">🌸 はなが さいたよ！</span>';
        if (grew === 'star') return '<span style="color:#5c6bc0; font-size:32px;">⭐ ほしが できたよ！</span>';
        return '<span style="color:#ff4081; font-size:32px;">🎉 大せいかい！ 🎉</span>';
    }

    async function onChoose(count, button) {
        if (busy) return;
        busy = true;
        setChoicesEnabled(false);
        emptyBoxes().forEach((box) => box.classList.remove('empty-hint'));

        const needed = neededCount();
        const known = knownCount();
        const shouldSpill = known + count > target;
        const colorClass = fillColor();
        const askRed = drillPhase === 'ask-red';

        messageEl.innerHTML = showBalls
            ? (askRed
                ? `あかだま を <strong>${count}</strong> こ いれるよ！`
                : `あおだま を <strong>${count}</strong> こ いれるよ！`)
            : `<strong>${count}</strong> を たしてみるよ！`;

        if (showBalls) {
            await animateBalls(count, button, colorClass);
        } else {
            await animateNumber(count, button, shouldSpill, colorClass);
        }

        if (count === needed) {
            solved = true;
            refreshEquation(count);
            const reward = await grantSolveReward();
            messageEl.innerHTML = rewardMessage(reward.wasComplete, reward.golden, reward.grew);
            choicesEl.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            flipReady = mode === 'drill2' && drillPhase === 'ask-blue';
            busy = false;
            return;
        }

        if (shouldSpill) {
            messageEl.innerHTML = `わあっ！ <strong>こぼれちゃった！</strong><br>${known} + ${count} は ${target} より おおいよ`;
            refreshEquation(count);
            framesContainer.querySelectorAll('.box').forEach((box) => box.classList.add('shake'));
        } else {
            emptyBoxes().forEach((box) => box.classList.add('empty-hint'));
            messageEl.innerHTML = `まだ <strong>たりないよ！</strong><br>すきま が あるね`;
            refreshEquation(count);
        }

        await wait(1600);
        clearFillBalls();
        document.querySelectorAll('.ball.flying, .num-chip').forEach((el) => el.remove());
        messageEl.innerHTML = promptMessage();
        refreshEquation();
        setChoicesEnabled(true);
        busy = false;
    }

    async function startCommutativeFlip() {
        busy = true;
        nextBtn.classList.add('hidden');
        messageEl.innerHTML = 'ぬまーかてん を まわすよ！';
        framesContainer.querySelectorAll('.ball.landed').forEach((ball) => {
            ball.classList.remove('landed');
        });

        await frameSpin.animate([
            { transform: 'rotate(0deg) scale(1)' },
            { transform: 'rotate(90deg) scale(0.92)', offset: 0.5 },
            { transform: 'rotate(180deg) scale(1)' }
        ], {
            duration: 1300,
            easing: 'cubic-bezier(0.45, 0.05, 0.55, 0.95)',
            fill: 'forwards'
        }).finished;

        const reds = [...framesContainer.querySelectorAll('.ball.red')];
        await Promise.all(reds.map((ball) => ball.animate([
            { opacity: 1, transform: 'scale(1)' },
            { opacity: 0, transform: 'scale(0.55)' }
        ], {
            duration: 380,
            easing: 'ease-in',
            fill: 'forwards'
        }).finished));
        reds.forEach((ball) => ball.remove());

        drillPhase = 'ask-red';
        solved = false;
        flipReady = false;
        choicesEl.classList.remove('hidden');
        setChoicesEnabled(true);
        messageEl.innerHTML = promptMessage();
        refreshEquation();
        applyDisplayMode();
        busy = false;
    }

    function onNextClick() {
        if (busy) return;
        if (flipReady) {
            startCommutativeFlip();
            return;
        }
        initGame();
    }

    document.querySelectorAll('.ctrl-btn[data-setting]').forEach((btn) => {
        btn.addEventListener('click', () => {
            const on = btn.dataset.value === 'on';
            if (btn.dataset.setting === 'grid') showGrid = on;
            if (btn.dataset.setting === 'balls') {
                showBalls = on;
                if (on) showGrid = true;
            }
            applyDisplayMode();
            if (!busy && !solved) {
                messageEl.innerHTML = promptMessage();
            }
        });
    });

    nextBtn.addEventListener('click', onNextClick);
    drill1Btn.addEventListener('click', () => startDrill('drill1'));
    drill2Btn.addEventListener('click', () => startDrill('drill2'));
    drill3Btn.addEventListener('click', () => startDrill('drill3'));
    loadState();
    refreshOrchard();
    buildTargetButtons();
    buildChoiceButtons();
    initGame();
</script>

</body>
</html>
